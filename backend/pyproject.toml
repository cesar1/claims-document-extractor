[project]
name = "claims-extractor"
version = "0.1.0"
description = "Extract structured JSON from insurance claim PDFs with Claude, with human review."
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.75",
    "pydantic>=2.8",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]
eval = [
    "faker>=30",
    "pillow>=10",
    "pypdf>=5",
    "pypdfium2>=4",
    "reportlab>=4",
]

[tool.setuptools]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
